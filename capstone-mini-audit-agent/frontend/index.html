<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Audit Agent — Autonomous Forensic AP & SOX 404 Verification</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; }
    pre, code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [sampleId, setSampleId] = useState("sample_cybershield");
      const [invoiceFile, setInvoiceFile] = useState(null);
      const [ledgerFile, setLedgerFile] = useState(null);
      const [jobId, setJobId] = useState(null);
      const [status, setStatus] = useState("idle"); // idle, running, awaiting_approval, completed, error
      const [events, setEvents] = useState([]);
      const [extractedInvoice, setExtractedInvoice] = useState(null);
      const [anomalies, setAnomalies] = useState([]);
      const [synthesis, setSynthesis] = useState("");
      const [finalReport, setFinalReport] = useState("");
      const [auditorNotes, setAuditorNotes] = useState("Professional skepticism applied: Verified duplicate submission against prior AP ledger batch.");
      const transcriptEndRef = useRef(null);

      // Auto-scroll transcript
      useEffect(() => {
        transcriptEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [events]);

      // Start Audit Investigation
      const startAudit = async (chosenSample = null) => {
        setStatus("running");
        setEvents([]);
        setExtractedInvoice(null);
        setAnomalies([]);
        setSynthesis("");
        setFinalReport("");

        const formData = new FormData();
        const activeSample = chosenSample || sampleId;

        if (activeSample) {
          formData.append("sample_id", activeSample);
        } else {
          if (invoiceFile) formData.append("invoice_file", invoiceFile);
          if (ledgerFile) formData.append("ledger_file", ledgerFile);
        }

        try {
          const res = await fetch("/api/audit/start", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          setJobId(data.job_id);

          // Connect SSE Stream
          listenToSSE(data.job_id);
        } catch (err) {
          setStatus("error");
          alert("Failed to start audit job: " + err.message);
        }
      };

      // Server-Sent Events Listener
      const listenToSSE = (currentJobId) => {
        const eventSource = new EventSource(`/api/audit/events/${currentJobId}`);

        eventSource.onmessage = (e) => {
          const data = JSON.parse(e.data);
          setEvents((prev) => [...prev, data]);

          if (data.type === "progress") {
            if (data.state_update?.invoice_data) {
              setExtractedInvoice(data.state_update.invoice_data);
            }
            if (data.state_update?.ledger_anomalies) {
              setAnomalies(data.state_update.ledger_anomalies.anomalies || []);
            }
          } else if (data.type === "awaiting_approval") {
            setStatus("awaiting_approval");
            setExtractedInvoice(data.invoice);
            setAnomalies(data.anomalies || []);
            setSynthesis(data.synthesis);
          } else if (data.type === "completed") {
            setStatus("completed");
            setFinalReport(data.report);
            eventSource.close();
          } else if (data.type === "error") {
            setStatus("error");
            eventSource.close();
          }
        };

        eventSource.onerror = () => {
          eventSource.close();
        };
      };

      // Submit Human Approval Sign-off
      const submitApproval = async (approved) => {
        try {
          const res = await fetch(`/api/audit/approve/${jobId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              approved: approved,
              notes: auditorNotes,
            }),
          });
          const data = await res.json();
          if (data.report) {
            setFinalReport(data.report);
            setStatus("completed");
          }
        } catch (err) {
          alert("Approval submission failed: " + err.message);
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="border-b border-slate-800 pb-6 mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="bg-indigo-600/30 text-indigo-400 p-2.5 rounded-xl border border-indigo-500/30 font-bold text-xl">
                  🔍
                </span>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-3">
                    Mini Audit Agent
                    <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      Capstone Live
                    </span>
                  </h1>
                  <p className="text-sm text-slate-400">
                    Autonomous Forensic Accounting, SOX 404 Controls & Human-in-the-Loop Certification
                  </p>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                ⚡ OpenCV + OCR
              </span>
              <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                🐼 Pandas Ledger
              </span>
              <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                🔌 MCP Server
              </span>
              <span className="text-xs bg-indigo-950 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700 font-mono">
                LangGraph StateGraph
              </span>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Left Column: Uploads & Controls */}
            <div className="lg:col-span-5 space-y-6">
              {/* Test Cases Panel */}
              <div className="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/80 shadow-xl">
                <h2 className="text-base font-semibold text-white mb-3 flex items-center gap-2">
                  <span>📂</span> 1. Select Audit Investigation Case
                </h2>
                <p className="text-xs text-slate-400 mb-4">
                  Run pre-packaged synthetic test datasets with subtle internal control red flags:
                </p>

                <div className="space-y-3">
                  <div
                    onClick={() => { setSampleId("sample_cybershield"); setInvoiceFile(null); }}
                    className={`p-3.5 rounded-xl border cursor-pointer transition-all ${
                      sampleId === "sample_cybershield"
                        ? "bg-indigo-600/15 border-indigo-500 text-white"
                        : "bg-slate-900/60 border-slate-700/60 text-slate-300 hover:border-slate-600"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-sm">Duplicate Invoice Submission</span>
                      <span className="text-xs px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">
                        AP-DUP-03
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-1">
                      CyberShield Solutions ($14,250.00) submitted twice on 2026-03-05.
                    </p>
                  </div>

                  <div
                    onClick={() => { setSampleId("sample_apex"); setInvoiceFile(null); }}
                    className={`p-3.5 rounded-xl border cursor-pointer transition-all ${
                      sampleId === "sample_apex"
                        ? "bg-indigo-600/15 border-indigo-500 text-white"
                        : "bg-slate-900/60 border-slate-700/60 text-slate-300 hover:border-slate-600"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-sm">Invoice Structuring / Smurfing</span>
                      <span className="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                        AP-STRUCT-02
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-1">
                      Apex Cloud Holdings ($49,990) adjacent to $49,950 evading $50k CFO dual-signoff.
                    </p>
                  </div>
                </div>

                <div className="mt-5 pt-4 border-t border-slate-700/60">
                  <button
                    disabled={status === "running"}
                    onClick={() => startAudit()}
                    className="w-full py-3 px-4 rounded-xl font-semibold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-lg shadow-indigo-600/30 disabled:opacity-50 flex items-center justify-center gap-2"
                  >
                    {status === "running" ? (
                      <>
                        <span className="animate-spin text-lg">⏳</span> Executing Agent Pipeline...
                      </>
                    ) : (
                      <>
                        <span>🚀</span> Run Autonomous Forensic Audit
                      </>
                    )}
                  </button>
                </div>
              </div>

              {/* Extracted Invoice Card */}
              {extractedInvoice && (
                <div className="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/80 shadow-xl">
                  <h3 className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                    <span>📑</span> OpenCV + OCR Extracted Metadata
                  </h3>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                      <span className="text-slate-400 block">Vendor Name</span>
                      <span className="font-semibold text-white text-sm">{extractedInvoice.vendor}</span>
                    </div>
                    <div className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                      <span className="text-slate-400 block">Invoice Number</span>
                      <span className="font-mono font-semibold text-indigo-400 text-sm">
                        {extractedInvoice.invoice_number}
                      </span>
                    </div>
                    <div className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                      <span className="text-slate-400 block">Total Amount</span>
                      <span className="font-semibold text-emerald-400 text-sm">
                        ${parseFloat(extractedInvoice.amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })} USD
                      </span>
                    </div>
                    <div className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                      <span className="text-slate-400 block">Invoice Date</span>
                      <span className="font-mono text-slate-200">{extractedInvoice.date}</span>
                    </div>
                  </div>
                </div>
              )}

              {/* Human-in-the-Loop Approval Gate */}
              {status === "awaiting_approval" && (
                <div className="bg-amber-950/40 rounded-2xl p-6 border-2 border-amber-500/80 shadow-2xl animate-pulse-subtle">
                  <div className="flex items-center gap-2 text-amber-400 font-bold text-sm mb-2">
                    <span className="text-lg">🛑</span> HUMAN-IN-THE-LOOP APPROVAL REQUIRED
                  </div>
                  <p className="text-xs text-amber-200/80 mb-4">
                    The agent has surfaced a compliance anomaly. As the licensed Lead Auditor, verify the evidence and apply professional skepticism before committing to workpapers.
                  </p>

                  {anomalies.map((anom, idx) => (
                    <div key={idx} className="bg-black/40 rounded-xl p-3 mb-3 border border-amber-500/30 text-xs">
                      <div className="flex justify-between items-center mb-1">
                        <span className="font-bold text-amber-300">{anom.type}</span>
                        <span className="bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded text-[10px] font-bold">
                          {anom.violation_code}
                        </span>
                      </div>
                      <p className="text-slate-300 text-[11px] leading-relaxed">{anom.rationale}</p>
                    </div>
                  ))}

                  <div className="mb-4">
                    <label className="text-xs font-semibold text-slate-300 block mb-1">
                      Lead Auditor Workpaper Notes:
                    </label>
                    <textarea
                      value={auditorNotes}
                      onChange={(e) => setAuditorNotes(e.target.value)}
                      className="w-full text-xs p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 focus:outline-none focus:border-amber-400"
                      rows="2"
                    ></textarea>
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={() => submitApproval(true)}
                      className="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-1.5"
                    >
                      <span>✓</span> Approve & Certify
                    </button>
                    <button
                      onClick={() => submitApproval(false)}
                      className="py-2.5 px-4 rounded-xl bg-rose-600/80 hover:bg-rose-600 font-semibold text-xs text-white"
                    >
                      Reject Finding
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Right Column: Live Stepper, Transcript, and Final Report */}
            <div className="lg:col-span-7 space-y-6">
              {/* Live Investigation Transcript */}
              <div className="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/80 shadow-xl flex flex-col h-[340px]">
                <div className="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
                  <h3 className="text-sm font-semibold text-white flex items-center gap-2">
                    <span>📡</span> Live Agent Investigation Stream (SSE)
                  </h3>
                  <span className="text-[11px] font-mono text-slate-400">
                    Job ID: {jobId || "None"}
                  </span>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 text-xs font-mono pr-2">
                  {events.length === 0 ? (
                    <div className="h-full flex items-center justify-center text-slate-500 text-center">
                      Ready to execute. Click 'Run Autonomous Forensic Audit' to begin.
                    </div>
                  ) : (
                    events.map((evt, idx) => (
                      <div key={idx} className="p-2 rounded bg-slate-900/60 border border-slate-800">
                        <span className="text-indigo-400 font-bold">[{evt.step || evt.type}]</span>{" "}
                        <span className="text-slate-300">{evt.message}</span>
                      </div>
                    ))
                  )}
                  <div ref={transcriptEndRef} />
                </div>
              </div>

              {/* Certified Final Report View */}
              {finalReport ? (
                <div className="bg-slate-800/80 rounded-2xl p-6 border border-emerald-500/40 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
                    <h3 className="text-sm font-bold text-emerald-400 flex items-center gap-2">
                      <span>📜</span> Certified SOX 404 Audit Exception Memorandum
                    </h3>
                    <button
                      onClick={() => navigator.clipboard.writeText(finalReport)}
                      className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-200 transition-all"
                    >
                      Copy Markdown
                    </button>
                  </div>
                  <pre className="text-xs text-slate-300 whitespace-pre-wrap font-mono bg-slate-950 p-4 rounded-xl border border-slate-800 max-h-[350px] overflow-y-auto leading-relaxed">
                    {finalReport}
                  </pre>
                </div>
              ) : (
                <div className="bg-slate-800/40 rounded-2xl p-8 border border-slate-800 border-dashed text-center text-slate-500 text-xs">
                  Final Certified Audit Exception Report will render here after Human-in-the-Loop review.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
